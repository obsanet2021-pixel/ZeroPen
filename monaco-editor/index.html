<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroPen Editor — Custom Monaco Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="activity-bar" id="activity-bar">
    <div class="activity-icon active" data-sidebar="explorer" title="Explorer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
      </svg>
    </div>
    <div class="activity-icon" data-sidebar="deepseek" title="DeepSeek AI">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </div>
    <div class="activity-icon" id="preview-toggle" title="Toggle Preview">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <div class="activity-icon" id="download-btn" title="Download Project as ZIP">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <a href="../index.html" class="activity-icon" title="Home" style="text-decoration:none;color:inherit;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <div style="flex:1;"></div>
    <div class="activity-icon" id="theme-toggle" title="Toggle Theme">
      <svg id="theme-icon-dark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
      <svg id="theme-icon-light" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
      </svg>
    </div>
  </div>
  <div class="resize-handle vertical" id="activity-bar-handle"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-content active" id="explorer-content">
      <div class="sidebar-header">EXPLORER</div>
      <div class="file-tree" id="file-tree"></div>
    </div>
    <div class="sidebar-content" id="deepseek-content">
      <div class="sidebar-header">DEEPSEEK AI</div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="message assistant">DeepSeek is ready.</div>
        </div>
        <div class="chat-input-area">
          <textarea id="chat-input" placeholder="Ask DeepSeek..." rows="2"></textarea>
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>
  <div class="resize-handle vertical" id="sidebar-handle"></div>
  <div class="main-area" id="main-area">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="editor-preview-split" id="editor-preview-split">
      <div class="editor-container" id="editor-container"></div>
      <div class="resize-handle horizontal" id="preview-handle"></div>
      <div class="preview-panel" id="preview-panel" style="display:none;">
        <div class="preview-header"><span>PREVIEW</span><button id="close-preview-btn">&times;</button></div>
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
    <div class="status-bar">
      <span id="current-file">No file open</span>
      <span>ZeroPen</span>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/resizer.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/download.js"></script>
</body>
</html>
