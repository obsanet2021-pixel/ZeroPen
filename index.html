@'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroPen – Free Live Code Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="editor-panel">
      <div class="editor-header">HTML</div>
      <div id="html-editor" class="editor"></div>
    </div>
    <div class="editor-panel">
      <div class="editor-header">CSS</div>
      <div id="css-editor" class="editor"></div>
    </div>
    <div class="editor-panel">
      <div class="editor-header">JS</div>
      <div id="js-editor" class="editor"></div>
    </div>
    <div class="preview-panel">
      <div class="editor-header">PREVIEW</div>
      <iframe id="preview-frame"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.min.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
'@ | Out-File -FilePath index.html -Encoding utf8
