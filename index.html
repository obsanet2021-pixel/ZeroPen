<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroPen — Code Editor with DeepSeek AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1e1e1e;
      color: #ccc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 40px;
      flex-wrap: wrap;
      padding: 20px;
    }
    .mode-card {
      background: #252526;
      border: 2px solid #444;
      border-radius: 12px;
      padding: 40px;
      width: 350px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .mode-card:hover {
      border-color: #0078d4;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,120,212,0.3);
    }
    .mode-card h2 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #fff;
    }
    .mode-card p {
      color: #999;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .mode-card .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-top: 12px;
    }
    .badge.open-source { background: #2ea043; color: #fff; }
    .badge.full-featured { background: #0078d4; color: #fff; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <a href="monaco-editor/index.html">
    <div class="mode-card">
      <div class="icon">🛠️</div>
      <h2>ZeroPen Editor</h2>
      <p>Our custom-built Monaco editor with file management, live preview, themes, and DeepSeek AI — fully open source.</p>
      <span class="badge open-source">Open Source</span>
    </div>
  </a>
  <a href="vscode-embed/index.html">
    <div class="mode-card">
      <div class="icon">⚡</div>
      <h2>VS Code + DeepSeek</h2>
      <p>Full VS Code for the Web with DeepSeek AI sidebar. All extensions, terminal, and features included.</p>
      <span class="badge full-featured">Full Featured</span>
    </div>
  </a>
</body>
</html>
